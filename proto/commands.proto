syntax = "proto2";
package proto;
import "enums.proto";
import "input_enums.proto";
import "input.proto";

message SetProfileCommand {
  required uint32 profileId = 1;
  optional uint32 instanceId = 2;
}

message DetectPinCommand {
  required PinDetectType detectType = 1;
}

// Watch a device (a wii extension, usb host controller etc) for an input being pressed or moved
message DetectInputCommand {
  required InputDetectKind kind = 1;
  // The slot or device id, as the input stores it
  required int32 deviceid = 2;
  // Also look for axes being moved, not just buttons being pressed
  required bool axes = 3;
  // USB and bluetooth: the Output fields to try, as Output oneof tags, each tried from 1 to its max
  optional uint32 buttonOutput = 4;
  optional uint32 buttonOutputMax = 5;
  optional uint32 axisOutput = 6;
  optional uint32 axisOutputMax = 7;
  // USB and bluetooth: also look for keyboard keys being pressed
  optional bool keys = 8;
  // MIDI: where the device comes from, as the MIDI input stores it
  optional MidiInputSourceType midiSourceType = 9;
}

message RebootCommand {

}
message DisconnectCommand {

}
message ScanCommand {

}
message SaveCommand {

}
// Forget a paired bluetooth controller: drops the connection, the bond and the pairing, and saves that
message UnpairBluetoothCommand {
  required int32 id = 1;
}
// Forget the hosts (PCs, phones etc) this controller has paired with over bluetooth, dropping a connected one.
// Paired controllers are kept, they're forgotten one at a time with UnpairBluetoothCommand
message ForgetBluetoothHostsCommand {

}
// Turn off a wireless controller on the USB host port or connected over bluetooth, by the sourceId of its hotplug event
message TurnOffControllerCommand {
  required uint32 sourceId = 1;
}
message CrkdCalibrationUpdateCommand {
  required uint32 id = 1;
  required CrkdDrumCalibrationType type = 2;
  required CrkdDrumAxisType axisType = 3;
  required uint32 val = 4;
}
message TestLedCommand {
  optional uint32 id = 1;
  optional uint32 durationMs = 2;
  optional uint32 profileId = 3;
}
// Change a cycling input's state from the host. With state, jumps straight to that index in its
// values, otherwise steps it like its forward input (or with forward false, its backward input)
message SetCycleCommand {
  required uint32 id = 1;
  optional uint32 state = 2;
  optional bool forward = 3;
}
message Command {
    oneof command {
        SetProfileCommand setProfile = 1;
        DetectPinCommand detectPin = 2;
        RebootCommand reboot = 3;
        CrkdCalibrationUpdateCommand crkdDrum = 4;
        DisconnectCommand disconnect = 5;
        ScanCommand scan = 6;
        SaveCommand save = 7;
        UnpairBluetoothCommand unpairBluetooth = 8;
        TestLedCommand testLed = 9;
        DetectInputCommand detectInput = 10;
        SetCycleCommand setCycle = 11;
        ForgetBluetoothHostsCommand forgetBluetoothHosts = 12;
        TurnOffControllerCommand turnOffController = 13;
    }
}
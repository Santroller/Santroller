syntax = "proto2";
package proto;

import "input.proto";
import "enums.proto";
import "device.proto";

message ProfileOpts {
  required uint32 uid = 1; 
  required FaceButtonMappingMode faceButtonMappingMode = 2;
  required string name = 5;
  required SubType deviceToEmulate = 6;
  optional bool xinputOnWindows = 10;
  optional bool invertYAxisHid = 11;
  optional bool ps4OrPs5Mode = 12;
  optional bool supportsSlider = 13;
  optional bool cymbalGlitchFix = 14;
  // 0: slots numbered by position in each assignment list, 1: per kind in each list,
  // 2: per kind and subtype across the whole profile
  optional uint32 deviceSlotIdVersion = 15;
  // Guitars only: queue fret / strum changes and present each one for at least
  // dequeueInterval100us, so a game polling at a fixed rate sees every transition.
  optional bool queueInputs = 16;
  optional uint32 dequeueInterval100us = 17;
  // Turntables only: in XInput mode on a PC, send table velocities across the full axis
  // instead of the 360's tiny -64 to +64, which XInput's default deadzones swallow.
  optional bool fullRangeTurntableOnPc = 18;
  // Jump to PS3 mode when RPCS3 probes the controller, so it can use USB passthrough.
  // Defaults to on when unset, and only applies to the controller types passthrough supports.
  optional bool ps3OnRpcs3 = 19;
  // Disconnect bluetooth controllers using this profile when its USB connection is suspended
  // (eg the PC going to sleep), so they turn off instead of running their batteries down
  optional bool disconnectBluetoothOnSuspend = 20;
  // 5-fret guitars only: on Xbox One / Series and PS4 / 5, send Select as D-pad Left instead,
  // which Rock Band 4 and Fortnite Festival can use to activate star power
  optional bool selectToDpadLeft = 21;
  // Guitars only: strum up and down share one debounce window, so a strum is ignored while
  // the other direction is still held or debouncing. The config tool keeps both strums'
  // debounce times the same while this is on.
  optional bool combinedStrumDebounce = 22;
  // Not a controller: only its LEDs run, while no other profile is active (so the device is only showing
  // its config interface, eg not plugged into anything or only charging). It has no assignments or
  // mappings. Only the first one is used.
  optional bool standbyLighting = 23;
  // Standby lighting only: also light up while every other active profile's USB host is suspended (eg the
  // console or PC is asleep), in place of their LEDs going off. Not much power can be drawn from a suspended
  // port, so this is off unless asked for.
  optional bool standbyWhileSuspended = 24;
  // Gamepads and fight sticks only: how the D-pad resolves opposite directions held at once
  optional SocdMode socdMode = 25;
}

message Profile {
  required ProfileOpts opts = 1;
  repeated ProfileAssignment assignments = 3;
  repeated Mapping mappings = 4;
  repeated Led leds = 9;
  // Standby lighting only: pressing any of these signals resume on the USB bus, which turns on a powered off
  // Xbox 360 the device is plugged into, like the guide button on a real controller. There can be one for
  // each controller it reads. The USB profiles handle waking
  // a host that went to sleep with them on it.
  repeated InputActivationTrigger standbyWake = 10;
}
message InputLedMapping {
  required Input input = 1;
  optional int32 min = 2;
  optional int32 max = 3;
  optional ReactiveRgbPatternType pattern = 4;
}
message PatternLedMapping {
  required RgbPatternType pattern = 1;
  required int32 speed = 2;
  required int32 brightness = 3;
}
message StaticLedMapping {

}
message RumbleLedMapping {
  required LedRumbleType type = 1;
}
message EuphoriaLedMapping {

}
message StageKitLedMapping {
  required StageKitLedType type = 1;
  required uint32 index = 2;
  required StageKitIndexMappingMode indexMappingMode = 3;
}
message PlaystationLedMapping {

}
message PlayerLedMapping {
  required int32 playerId = 1;
}
message KeyboardLedMapping {
  required KeyboardLedType type = 1;
}
message GameFeedbackLedMapping {
  required GameFeedbackLedType type = 1;
  // The multiplier for FeedbackMultiplier, or the note for FeedbackNoteHit
  optional uint32 value = 2;
}
message StatusLedMapping {
  required StatusLedType type = 1;
  // For StatusConsoleMode
  optional ConsoleMode mode = 2;
}
message RGBLedDevice {
  required int32 deviceId = 1;
  required int32 startR = 2;
  required int32 startG = 3;
  required int32 startB = 4;
  required int32 startW = 5;
  required int32 endR = 6;
  required int32 endG = 7;
  required int32 endB = 8;
  required int32 endW = 9;
  repeated uint32 activeLed = 10;
  required bool hasStart = 11;
}
message DMXLedDevice {
  required int32 deviceId = 1;
  required int32 channel = 2;
}
message GpioLedDevice {
  required int32 pin = 1;
  required bool analog = 3;
  optional bool inverted = 4;
}
message VTechGuitarIOExpanderLedDevice {
  required int32 deviceId = 1;
  required int32 activeLed = 2;
}
// A GPIO on an MPR121 (electrodes 4 to 11)
message MPR121LedDevice {
  required int32 deviceId = 1;
  required int32 pin = 2;
}
message STP16CPCLedDevice {
  required int32 deviceId = 1;
  repeated int32 activeLed = 2;
}
// One element drawn on a display, while its mapping has it on. Elements are drawn in the order they
// are listed in, over the top of the ones before them.
message DisplayLedDevice {
  required int32 deviceId = 1;
  required DisplayElementType type = 2;
  // Top left corner, in pixels
  required int32 x = 3;
  required int32 y = 4;
  // Everything but text
  optional int32 width = 5;
  optional int32 height = 6;
  // Text only: each character is 6 x 8 pixels times this, unset is 1
  optional uint32 scale = 7;
  optional string text = 8;
  // 1 bit per pixel, row by row (each starting on a new byte), most significant bit first, set bits lit
  optional bytes image = 9;
  // Draw lit pixels dark and dark pixels lit
  optional bool invert = 10;
  // Bars only: fill from the bottom up instead of left to right
  optional bool vertical = 11;
  // Joysticks only: the axes that move the dot, larger is right and up like a stick's X and Y
  optional Input stickX = 12;
  optional Input stickY = 13;
  // Rectangles and circles only: drawn as an outline while the LED is off instead of not at all
  optional bool outlineWhenOff = 14;
}
message LedDevice {
  oneof device {
    RGBLedDevice rgb = 4;
    GpioLedDevice gpio = 5;
    STP16CPCLedDevice stp16 = 6;
    VTechGuitarIOExpanderLedDevice vtechExpander = 7;
    DMXLedDevice dmx = 8;
    MPR121LedDevice mpr121 = 9;
    DisplayLedDevice display = 10;
  }
}
message LedMapping {
  oneof led {
    InputLedMapping inputMapping = 1;
    PatternLedMapping patternMapping = 2;
    StaticLedMapping staticMapping = 3;
    RumbleLedMapping rumbleMapping = 4;
    EuphoriaLedMapping euphoriaMapping = 5;
    StageKitLedMapping stageKitMapping = 6;
    PlaystationLedMapping playstationMapping = 7;
    PlayerLedMapping playerMapping = 8;
    KeyboardLedMapping keyboardMapping = 9;
    GameFeedbackLedMapping gameFeedbackMapping = 10;
    StatusLedMapping statusMapping = 11;
  }
}
message Led {
    required LedDevice device = 1;
    required LedMapping mapping = 2;
}

message SpecificUsbDevice {
  required uint32 vid = 1;
  required uint32 pid = 2;
  // The type of device expected, which numbers its slot with the other slots of that type
  optional SubType subtype = 3;
}

message AnyMidiSourceDevice {

}
// Limits a MIDI slot to one device, or to where it's connected, instead of any device that has sent on its channel
message MidiSourceDevice {
  oneof device {
    SpecificUsbDevice usbDevice = 1;
    SpecificBluetoothDevice bluetoothDevice = 2;
    // A device from the config, eg a serial MIDI input or a Wii extension
    int32 deviceid = 3;
    // Any device on the USB host port
    AnyMidiSourceDevice usbHost = 4;
    // Any bluetooth device
    AnyMidiSourceDevice bluetooth = 5;
  }
}

message UsbDeviceAssignment {
  optional ConsoleType consoleType = 1;
  optional ConsoleMode forcedType = 2;
  optional bool xinputOnWindows = 3;
  optional bool ps4OrPs5Mode = 4;
}
message SpecificBluetoothDevice {
  required uint32 vid = 1;
  required uint32 pid = 2;
  // The type of device expected, which numbers its slot with the other slots of that type
  optional SubType subtype = 3;
}

message WiimoteAssignment {

}
message PSXAssignment {

}
message JoybusAssignment {

}
message SNESAssignment {

}
// The inputs on this device itself (GPIO, ADC, I2C peripherals etc). Only one active profile can have
// them, so profiles that output them in different ways (eg USB, then bluetooth) don't all match at once
message LocalInputsAssignment {

}
// Lets a rule match without its controllers on an Xbox One, while trigger is active and an Xbox One controller on
// the USB host can authenticate for it. That controller is claimed into a USB gamepad slot, so trigger can read it
// (eg a button held while plugging it in), and isn't used by other profiles. Once the console has authenticated, the
// rule stays matched after the controller is unplugged until the console asks again, so the rule's instrument can
// take its place.
message XboxOneAuthAssignment {
  // Any Xbox One controller authenticates for the rule without one
  optional InputActivationTrigger trigger = 2;
  reserved 1;
}

message ProfileAssignmentInfo {
  oneof assignment {
    UsbDeviceAssignment consoleType = 4;
    WiiExtType wiiExt = 5;
    PS2ControllerType ps2Cnt = 6;
    SubType usbType = 7;
    SpecificUsbDevice usbDevice = 8;
    InputActivationTrigger input = 10; // Input at startup
    InputActivationTrigger inputAnyTime = 11; // Input at any time
    uint32 midiChannel = 13;
    BluetoothMode bluetooth = 14;
    WiimoteAssignment wiiEmulation = 16;
    PSXAssignment ps2Emulation = 17;
    SpecificBluetoothDevice bluetoothDevice = 15;
    SubType bluetoothType = 18;
    JoybusAssignment joybusEmulation = 19;
    SNESAssignment snesEmulation = 20;
    // A Pro Guitar seen over MIDI, ProGuitarMustang or ProGuitarSquier
    SubType midiProGuitar = 21;
    LocalInputsAssignment localInputs = 22;
    SNESControllerType snesCnt = 23;
    JoybusControllerType joybusCnt = 24;
    XboxOneAuthAssignment xboxOneAuth = 25;
  }
  // Only for midiChannel and midiProGuitar, which otherwise take any MIDI device
  optional MidiSourceDevice midiDevice = 26;
  reserved 12;
}

message ProfileAssignment {
  repeated ProfileAssignmentInfo assignments = 1;
}
message GuiDevice {
  required string label = 1;
  required int32 pin = 2;
  optional bool showToCustomer = 3;
}
message GuiLed {
  required string label = 1;
  required int32 deviceid = 2;
  repeated uint32 activeLed = 3;
  optional bool showToCustomer = 4;
}
message GuiMultiplexerDevice {
  required string label = 1;
  required int32 deviceid = 2;
  required uint32 channel = 3;
  optional bool showToCustomer = 4;
}
message GuiMatrixDevice {
  required string label = 1;
  required int32 deviceid = 2;
  required uint32 inputPin = 3;
  required uint32 outputPin = 4;
  optional bool showToCustomer = 5;
}
message GuiSwitchNetworkDevice {
  required string label = 1;
  required int32 deviceid = 2;
  required uint32 pin = 3;
  required uint32 otherPin = 4;
  optional bool showToCustomer = 5;
}
// Names a key on a USB host keyboard, by its HID keycode
message GuiKeyboardKey {
  required string label = 1;
  required int32 key = 2;
  optional bool showToCustomer = 3;
}
message SellerConfig {
  required bytes logo = 1;
  required string name = 2;
  optional bytes favicon = 3;
}
message GuiConfig {
  required int32 deviceid = 1;
  oneof config {
    GuiDevice label = 2;
    SellerConfig seller = 3;
    GuiLed ledLabel = 4;
    GuiMultiplexerDevice multiplexerLabel = 5;
    GuiMatrixDevice matrixLabel = 6;
    GuiSwitchNetworkDevice switchNetworkLabel = 7;
    GuiKeyboardKey keyboardKeyLabel = 8;
  }
  // uids of the profiles a label is shown in, or every profile when empty
  repeated uint32 profiles = 9;
}

message PeripheralBootConfig {
  required I2CDevice i2c = 1;
  required int32 idPin = 2;
}

// Timeouts are measured from the last time a button changed state
message InactivityConfig {
  // Go to sleep after this many seconds without input, while not connected over USB (0 disables).
  // Pressing the button on wakePin wakes the controller back up, so sleep needs a wakePin.
  optional uint32 sleepTimeoutSec = 1;
  optional int32 wakePin = 2;
  // Wake on a rising edge instead of a falling one
  optional bool wakeActiveHigh = 3;
  // Turn the LEDs off after this many seconds without input (0 disables)
  optional uint32 ledTimeoutSec = 4;
}

message Config {
  repeated Device devices = 2;
  repeated Profile profiles = 3;
  repeated GuiConfig guiConfig = 4;
  optional bool syncCalibrations = 5;
  optional PeripheralBootConfig peripheralBoot = 6;
  optional InactivityConfig inactivity = 7;
  // What the whole device is called over USB (its product string), rather than one profile.
  // Unset or empty keeps "Santroller"
  optional string deviceName = 8;
  // USB manufacturer string. Unset or empty keeps "sanjay900"
  optional string manufacturerName = 9;
  // Always emulate the Rock Band 4 wireless legacy adapter on Xbox One / Series, instead of only when there's
  // more than one player. Gamepads still work outside of Rock Band 4, and players can come and go without
  // authenticating again. Supports Guitar Hero Live guitars, but not toy portals.
  optional bool xboxOneLegacyAdapter = 10;
  // WLA gamepad support is unconditional; ignore this retired option in older configs.
  reserved 11;
  reserved "xboxOneLegacyAdapterGamepad";
}

message ConfigInfo {
  required int32 dataSize = 1;
  required int32 dataCrc = 2;
  required int32 mainSize = 3;
  required int32 auxSize = 4;
  required int32 magic = 5;
  optional bool missingStaticFirmware = 6;
  optional bool needsUf2Update = 7;
  // Send firmware uploads as output reports, with a ReportIdUpdateFirmware feature report after each
  // 4096 byte block to wait for it and check it arrived. Only set over bluetooth.
  optional bool streamedFirmwareUpload = 8;
  // The bootloader has a different flash layout to this firmware, so updates can't go over OTA (the device
  // refuses them) until it is reflashed from a UF2. needsUf2Update is set too.
  optional bool bootloaderOutdated = 9;
  // Another configurator has the device open over the other transport (USB or bluetooth). Until it
  // closes, this one can't read the config or change anything.
  optional bool inUseByOtherTool = 10;
  // The bootloader's boot stage reads flash with the slow 03h command, which costs a lot of CPU time.
  // Updates still go over OTA, but they don't replace the bootloader, so only a UF2 fixes it.
  // needsUf2Update is set too.
  optional bool slowBootStage = 11;
  // How much config each ReportIdConfig read returns, the last one being shorter. Anything after that
  // in a report is padding. Smaller over bluetooth HID, where reads leave room for a byte of padding.
  optional uint32 configChunkSize = 12;
}

message GetActiveProfiles {
  repeated int32 profiles = 1;
  // A profile forces this mode, but switching was held off as it would drop the tool's connection
  optional ConsoleMode deferredMode = 2;
}

message GetVersion {
  required string version = 1;
}

message GetType {
  required string type = 1;
}
message FirmwareUpdate {
  required int32 firmwareSize = 1;
  required int32 offset = 2;
  required int32 chunkOffset = 3;
  required int32 chunkSize = 4;
  optional uint32 deviceId = 5;
}
message CyclingInputState {
  required int32 id = 1;
  required int32 state = 2;
}

message ToggleInputState {
  required int32 id = 1;
  required bool state = 2;
}

message BluetoothPairingState {
  required int32 id = 1;
  required bytes macAddress = 2;
  required string name = 3;
  required bool ble = 4;
  optional SubType subtype = 5;
  optional BtControllerType controllerType = 6;
  optional uint32 vid = 7;
  optional uint32 pid = 8;
  optional bytes linkKey = 9;
}

message BluetoothTlvEntry {
  required uint32 tag = 1;
  required bytes value = 2;
}

message AuxConfigBlock {
  repeated CyclingInputState states = 1;
  repeated ToggleInputState toggleStates = 2;
  repeated BluetoothPairingState bluetoothStates = 3;
  repeated BluetoothTlvEntry tlvEntries = 4;
  // Guitar Hero Arcade: the cabinet side the guitar was last told it is on (1 left, 2 right)
  optional uint32 ghArcadeSide = 5;
}
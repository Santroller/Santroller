syntax = "proto2";

package proto;
import "enums.proto";
import "input.proto";

message UARTDevice {
  required int32 block = 1;
  required int32 tx = 2;
  required int32 rx = 3;
  required int32 baudrate = 4;
}

message I2CDevice {
  required int32 block = 1;
  required int32 sda = 2;
  required int32 scl = 3;
  required int32 clock = 4;
}

message SPIDevice {
  required int32 block = 1;
  required int32 mosi = 2;
  required int32 miso = 3;
  required int32 sck = 4;
  required int32 clock = 5;
}
message PeripheralDevice {
  required I2CDevice i2c = 1;
  required int32 address = 2;
  repeated Device devices = 3;
  repeated Input inputs = 4;
}

// The filters run on every new sample from the accelerometer, before any mapping sees it, so they
// can use all three axes and see samples arriving faster than the inputs are polled. Each one is
// off unless it is set, and they run in this order.
message AccelerometerDevice {
  required I2CDevice i2c = 1;
  // Drop samples whose total acceleration is more than this far from gravity (in g), as movement
  // like a strum bar hit dominates them instead of tilt. The last good sample is held meanwhile.
  optional float gateTolerance = 2;
  // Median of the last this many samples (3 - 9), so short spikes are dropped instead of smoothed in
  optional uint32 medianSamples = 3;
  // 2nd order Butterworth low pass, in Hz
  optional float lowPassCutoff = 4;
}

message Max1704xDevice { required I2CDevice i2c = 1; }

// Estimates the battery level from its voltage on an ADC pin (GP26 to GP29). On a Pico, GP29
// reads VSYS through the board's own divide by 3. On a Pico W GP29 is shared with the wireless
// chip, so it can only be read there while bluetooth is set up.
message AdcBatteryDevice {
  required int32 pin = 1;
  // How much the battery voltage is divided down before the pin, times 1000 (3000 for VSYS)
  required uint32 dividerX1000 = 2;
  // Battery voltages read as 0% and 100%, in mV. The level goes linearly between them.
  required uint32 emptyMv = 3;
  required uint32 fullMv = 4;
}

message XboxOneAuthDevice {
  required I2CDevice i2c = 1;
  optional int32 resetPin = 2;
}

message Mpr121Device {
  required I2CDevice i2c = 1;
  required int32 touchpadCount = 2;
  required int32 ddrPins = 3;
  required int32 enablePins = 4;
}
message ADS1115Device {
  required I2CDevice i2c = 1;
  required int32 interrupt = 2;
}

message WiiDevice {
  required I2CDevice i2c = 1;
  required MappingMode mappingMode = 2;
  optional uint32 turntablePollIntervalMs = 3;
}

message CrazyGuitarNeckDevice { required I2CDevice i2c = 1; }

message GuitarHero5NeckDevice { required I2CDevice i2c = 1; }

message DJHeroTurntableDevice {
  required I2CDevice i2c = 1;
  required bool left = 2;
  // the platter reports how far it moved since the last read, so this sets the velocity range (minimum 1)
  optional uint32 pollIntervalMs = 3;
}

message BandHeroDrumDevice { required I2CDevice i2c = 1; }

message SerialMidiDevice {
  required UARTDevice uart = 1;
  optional uint32 noteHoldTime = 2;
  // In reads the RX pin as an input device, Out sends the MIDI profile's output on the TX pin.
  // Unset is In, which is what every config before this field was
  optional MidiSerialDirection direction = 3;
}
message CrkdNeckDevice { required UARTDevice uart = 1; }
message CrkdDrumDevice { required UARTDevice uart = 1; }
message DebugDevice { required UARTDevice uart = 1; }
message UsbHostDevice {
  required int32 firstPin = 1;
  required bool enable5v = 2;
  required bool dmFirst = 3;
  required MappingMode mappingMode = 4;
  optional uint32 noteHoldTime = 5;
}
message BluetoothDevice {
  // optional button that starts pairing a controller (active low)
  optional int32 syncPin = 1;
  // Turn bluetooth off after this many seconds without input, while acting as a bluetooth
  // controller and with no controllers connected to it (0 disables). Any input turns it back on.
  optional uint32 timeoutSec = 2;
}
message MultiplexerDevice {
  required int32 inputPin = 1;
  required bool sixteenChannel = 2;
  required int32 s0Pin = 3;
  required int32 s1Pin = 4;
  required int32 s2Pin = 5;
  required int32 s3Pin = 6;
  // CD4051 style multiplexers need time to settle after switching channels
  optional bool slow = 7;
}
message WorldTourDrumDevice {
  required SPIDevice spi = 1;
  required int32 csPin = 2;
}
message PSXDevice {
  required SPIDevice spi = 1;
  required int32 attPin = 2;
  required int32 ackPin = 3;
  required MappingMode mappingMode = 4;
}
message ProtarNeckDevice {
  required SPIDevice spi = 1;
  required int32 attPin = 2;
}
message SNESDevice {
  required int32 clockPin = 1;
  required int32 latchPin = 2;
  required int32 dataPin = 3;
  required MappingMode mappingMode = 4;
}
message JoybusDevice {
  required int32 dataPin = 1;
  required MappingMode mappingMode = 2;
}

message WiiEmulationDevice {
  required I2CDevice i2c = 1;
  // Wiimote extension detect line. When set, it is driven low to simulate unplugging
  // the extension so the Wiimote re-reads its ID; leave unset if detect is hardwired high.
  optional int32 detectPin = 2;
}
message PSXEmulationDevice {
  required int32 dataPin = 1;
  required int32 commandPin = 2;
  required int32 attentionPin = 3;
  required int32 clockPin = 4;
  required int32 acknowledgePin = 5;
}
message JoybusEmulationDevice {
  required int32 dataPin = 1;
  // Defaults to GameCube
  optional JoybusConsole console = 2;
}
message SNESEmulationDevice {
  required int32 clockPin = 1;
  required int32 latchPin = 2;
  required int32 dataPin = 3;
  required SNESConsole console = 4;
}
message EncoderDevice {
  required int32 dataPin = 1;
  optional int32 deltaRate = 2;
  optional int32 divisor = 3;
}

message WS2812Device {
  required int32 pin = 1;
  required WS2812Type type = 2;
  required int32 count = 3;
}
message APA102Device {
  required SPIDevice spi = 1;
  required APA102Type type = 2;
  required int32 count = 3;
}
// A monochrome OLED. What it shows comes from display LEDs, each one an element drawn on it while its
// LED mapping is on
message DisplayDevice {
  // Set for a display on I2C, otherwise it's on spi
  optional I2CDevice i2c = 1;
  required DisplayController controller = 2;
  // 7 bit I2C address, unset is 0x3C
  optional int32 address = 3;
  // The panel's height: 64 or 32 pixels (unset is 64). The SH1107 is always 128.
  optional uint32 height = 4;
  // Quarter turns clockwise that everything is rotated by on the panel, so it can be mounted upside down
  // or sideways. Positions on the display are after rotating.
  optional uint32 rotation = 5;
  // 0 - 255, unset is 207
  optional uint32 contrast = 6;
  // The SH1107 panel's width: 64 or 128 pixels (unset is 128). The rest are always 128.
  optional uint32 width = 7;
  // A display on SPI: MOSI and SCK (it has no MISO, and the clock is set by the controller), the pin that
  // picks commands or data, and its chip select and reset pins (unset or -1 when they're wired to GND
  // and 3V3)
  optional SPIDevice spi = 8;
  optional int32 dc_pin = 9;
  optional int32 cs_pin = 10;
  optional int32 reset_pin = 11;
}
message VTechGuitarIOExpanderDevice {
  required SPIDevice spi = 1;
  required int32 attPin = 2;
}
message STP16CPCDevice {
  required SPIDevice spi = 1;
  required int32 oe = 2;
  required int32 le = 3;
  required int32 count = 4;
}
message MatrixDevice {
  // Pin masks for GPIO 0-31, with GPIO 32-63 in the *High fields
  required uint32 outPins = 1;
  required uint32 inPins = 2;
  optional uint32 outPinsHigh = 3;
  optional uint32 inPinsHigh = 4;
  // Santroller 1 matrices drive the selected output low and use input pull-ups.
  optional bool activeLow = 5 [default = false];
}

message SwitchNetworkButton {
  required uint32 pin = 1;
  required uint32 otherPin = 2;
}

message SwitchNetworkDevice {
  required uint32 pins = 1;
  repeated SwitchNetworkButton buttons = 2;
}

message CycleDevice {
  required CycleType type = 1;
  repeated int32 values = 2;
}
message ToggleDevice {
}

message Xbox360RfDevice {
  required Xbox360RfModuleType type = 1;
  required int32 dataPin = 2;
  required int32 clockPin = 3;
  // optional button that starts syncing a controller (active low)
  optional int32 syncPin = 4;
}

// Drives the power button / load pins of a battery module (eg a TP4056 charger with a boost
// converter), based on how long it has been since the last input
message PowerManagementDevice {
  // Heartbeat: while there has been an input in the last heartbeatTimeoutMs, pulse heartbeatPin
  // for heartbeatPulseMs every heartbeatPeriodMs (with no heartbeatTimeoutMs it always pulses).
  // Drawing a little extra current every so often stops power banks with a low load shutdown
  // from turning off while the controller is in use.
  optional int32 heartbeatPin = 1;
  optional bool heartbeatInvert = 2;
  optional uint32 heartbeatPeriodMs = 3;
  optional uint32 heartbeatPulseMs = 4;
  optional uint32 heartbeatTimeoutMs = 5;
  // Inactivity output: once there has been no input for inactivityTimeoutMs, drive inactivityPin
  // until there is an input again. With inactivityPulseCount set, send that many pulses instead
  // (inactivityPulseMs long, starting inactivityPulsePeriodMs apart), for modules that need their
  // power button pressed, or double pressed, to turn off.
  optional int32 inactivityPin = 6;
  optional bool inactivityInvert = 7;
  optional uint32 inactivityTimeoutMs = 8;
  optional uint32 inactivityPulseCount = 9;
  optional uint32 inactivityPulsePeriodMs = 10;
  optional uint32 inactivityPulseMs = 11;
  // Only drive the inactivity output while not connected over USB
  optional bool inactivityNotOnUsb = 12;
}

message DMXDevice {
  required int32 pin = 1;
  required int32 channelCount = 2;
}

// Only loads a device while a pin reads a certain way, so devices on different connectors can share
// pins (eg a PS2 and a SNES port wired to the same GPIOs) without both of them driving those pins.
// The connectors are told apart by what they do to the pin: tie it high or low, or (on an ADC pin)
// pull it to a different voltage through a resistor on each. Plugging one in or out reloads the config.
message DeviceGate {
  required int32 pin = 1;
  required PinMode pinMode = 2;
  // Load while the voltage on the pin (GP26 to GP29) is between minMv and maxMv, inclusive.
  // Otherwise the pin is read as digital, and like GPIO inputs it is active low with a pull up.
  optional bool analog = 3;
  optional uint32 minMv = 4;
  optional uint32 maxMv = 5;
}

message Device {
  required int32 deviceid = 1;
  optional DeviceGate gate = 50;
  oneof device {
    AccelerometerDevice accelerometer = 2;
    Max1704xDevice max1704x = 4;
    Mpr121Device mpr121 = 5;
    WiiDevice wii = 6;
    CrazyGuitarNeckDevice crazyGuitarNeck = 7;
    GuitarHero5NeckDevice gh5Neck = 8;
    DJHeroTurntableDevice djhTurntable = 9;
    BandHeroDrumDevice bhDrum = 10;
    SerialMidiDevice midiSerial = 11;
    UsbHostDevice usbHost = 12;
    MultiplexerDevice multiplexer = 13;
    WorldTourDrumDevice worldTourDrum = 14;
    PSXDevice psx = 15;
    SNESDevice snes = 16;
    JoybusDevice joybus = 17;
    WiiEmulationDevice wiiEmulation = 18;
    PSXEmulationDevice psxEmulation = 19;
    JoybusEmulationDevice joybusEmulation = 20;
    PeripheralDevice peripheral = 21;
    CrkdNeckDevice crkdNeck = 22;
    ADS1115Device ads1115 = 23;
    EncoderDevice encoder = 24;
    DebugDevice debug = 25;
    WS2812Device ws2812 = 26;
    APA102Device apa102 = 27;
    STP16CPCDevice stp16cpc = 28;
    BluetoothDevice bt = 29;
    ProtarNeckDevice protarNeck = 30;
    VTechGuitarIOExpanderDevice vtechExpander = 31;
    MatrixDevice matrix = 32;
    CrkdDrumDevice crkdDrum = 33;
    SwitchNetworkDevice switchNetwork = 37;
    CycleDevice cycle = 34;
    ToggleDevice toggle = 35;
    DMXDevice dmx = 36;
    InfiniumFaderDevice infiniumFader = 38;
    XboxOneAuthDevice xboxOneAuth = 39;
    Xbox360RfDevice xbox360Rf = 40;
    PowerManagementDevice powerManagement = 41;
    AdcBatteryDevice adcBattery = 42;
    SNESEmulationDevice snesEmulation = 43;
    DisplayDevice display = 44;
  }
}
message InfiniumFaderDevice {
  required UARTDevice uart = 1;
}
